<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kristall Kombat Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #121318;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 20px 15px;
        }
        .header { text-align: center; margin-top: 10px; }
        .balance { font-size: 40px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        
        .tab-content { display: none; text-align: center; }
        .tab-content.active { display: block; }
        
        .tap-btn {
            background: radial-gradient(circle, #0088cc 0%, #005588 100%);
            border: 4px solid #38bdf8;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin: 40px auto;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.5);
        }
        .tap-btn:active { transform: scale(0.95); }

        /* Нижнее меню */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: #1c1d24;
            padding: 12px;
            border-radius: 16px;
        }
        .nav-item {
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            border: none;
            background: none;
        }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>💎 Kristall Kombat</h2>
        <div class="balance"><span id="score">0</span> 💎</div>
    </div>

    <div id="tab-clicker" class="tab-content active">
        <button class="tap-btn" onclick="tap()">ТАП!</button>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3>⛏️ Шахта</h3>
        <p style="margin-top: 10px; color: #aaa;">Улучшай карточки и получай пассивный доход!</p>
    </div>

    <div id="tab-profile" class="tab-content">
        <h3>👤 Профиль</h3>
        <p style="margin-top: 10px; color: #aaa;">Твой уровень: Новичок</p>
    </div>

    <div class="nav-menu">
        <button class="nav-item active" onclick="switchTab('clicker', this)">🎮 Главная</button>
        <button class="nav-item" onclick="switchTab('mine', this)">⛏️ Шахта</button>
        <button class="nav-item" onclick="switchTab('profile', this)">👤 Профиль</button>
    </div>

    <script>
        let score = 0;
        function tap() {
            score++;
            document.getElementById('score').innerText = score;
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
        }

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
