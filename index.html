<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kristall Economy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .level-tag { font-weight: bold; color: #38bdf8; font-size: 14px; }

        /* Баланс */
        .score-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            margin-top: 10px;
        }

        .passive-income {
            font-size: 14px;
            color: #a7f3d0;
            margin-top: -5px;
        }

        /* Главные экраны */
        .screen { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .hidden { display: none !important; }

        /* Кликер */
        .crystal-btn {
            font-size: 140px;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.4));
            margin: 30px 0;
        }

        /* Магазин Бустов */
        .shop-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .boost-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .boost-info h4 { margin: 0; font-size: 16px; color: #38bdf8; }
        .boost-info p { margin: 4px 0 0; font-size: 12px; color: #94a3b8; }

        .buy-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .buy-btn:disabled { background: #475569; color: #94a3b8; }

        /* Энергия */
        .energy-container { width: 100%; max-width: 320px; }
        .energy-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
        .energy-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 10px; transition: width 0.2s ease; }

        /* Нижнее меню */
        .nav-bar {
            width: 100%;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .nav-btn.active { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

        /* Анимация текста +1 */
        .floating-text {
            position: absolute;
            font-size: 30px;
            font-weight: 900;
            color: #38bdf8;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="level-tag" id="userLevel">💎 Новичок</span>
        <span>⚡ Kristall Bot</span>
    </div>

    <div class="score-container">
        💎 <span id="score">0</span>
    </div>
    <div class="passive-income">+<span id="incomePerSec">0</span>/сек</div>

    <div id="gameScreen" class="screen">
        <div class="crystal-btn" id="crystal">💎</div>
    </div>

    <div id="shopScreen" class="screen hidden">
        <div class="shop-container">
            <div class="boost-card">
                <div class="boost-info">
                    <h4>🖐 Мультитап</h4>
                    <p>+1 к клику (<span id="tapLvl">1</span> lvl)</p>
                </div>
                <button class="buy-btn" id="buyTapBtn" onclick="buyTap()">💎 <span id="tapCost">100</span></button>
            </div>
            <div class="boost-card">
                <div class="boost-info">
                    <h4>🔋 Лимит энергии</h4>
                    <p>+500 энергии (<span id="energyLvl">1</span> lvl)</p>
                </div>
                <button class="buy-btn" id="buyEnergyBtn" onclick="buyEnergy()">💎 <span id="energyCost">150</span></button>
            </div>
            <div class="boost-card">
                <div class="boost-info">
                    <h4>🤖 Авто-Майнер</h4>
                    <p>+1 монета/сек (<span id="minerLvl">0</span> lvl)</p>
                </div>
                <button class="buy-btn" id="buyMinerBtn" onclick="buyMiner()">💎 <span id="minerCost">200</span></button>
            </div>
        </div>
    </div>

    <div class="energy-container">
        <div class="energy-info">
            <span>⚡ Энергия</span>
            <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" id="btnMain" onclick="showScreen('main')">💎 Игра</button>
        <button class="nav-btn" id="btnShop" onclick="showScreen('shop')">🚀 Бусты</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        // Загрузка сохранённого состояния
        let score = parseInt(localStorage.getItem('score')) || 0;
        let tapPower = parseInt(localStorage.getItem('tapPower')) || 1;
        let maxEnergy = parseInt(localStorage.getItem('maxEnergy')) || 1000;
        let energy = parseInt(localStorage.getItem('energy')) || maxEnergy;
        let passiveIncome = parseInt(localStorage.getItem('passiveIncome')) || 0;

        let tapCost = parseInt(localStorage.getItem('tapCost')) || 100;
        let energyCost = parseInt(localStorage.getItem('energyCost')) || 150;
        let minerCost = parseInt(localStorage.getItem('minerCost')) || 200;

        const crystal = document.getElementById('crystal');

        // Клик по кристаллу
        crystal.addEventListener('pointerdown', (e) => {
            if (energy < tapPower) return;

            score += tapPower;
            energy -= tapPower;
            
            saveData();
            updateUI();

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            crystal.style.transform = 'scale(0.9)';
            createFloatingNumber(e.clientX, e.clientY, `+${tapPower}`);
        });

        crystal.addEventListener('pointerup', () => crystal.style.transform = 'scale(1)');

        function createFloatingNumber(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x - 15}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Покупка мультитапа
        function buyTap() {
            if (score >= tapCost) {
                score -= tapCost;
                tapPower += 1;
                tapCost = Math.round(tapCost * 1.8);
                saveData();
                updateUI();
            }
        }

        // Покупка энергии
        function buyEnergy() {
            if (score >= energyCost) {
                score -= energyCost;
                maxEnergy += 500;
                energy += 500;
                energyCost = Math.round(energyCost * 1.8);
                saveData();
                updateUI();
            }
        }

        // Покупка майнера
        function buyMiner() {
            if (score >= minerCost) {
                score -= minerCost;
                passiveIncome += 1;
                minerCost = Math.round(minerCost * 2);
                saveData();
                updateUI();
            }
        }

        function saveData() {
            localStorage.setItem('score', score);
            localStorage.setItem('tapPower', tapPower);
            localStorage.setItem('maxEnergy', maxEnergy);
            localStorage.setItem('energy', energy);
            localStorage.setItem('passiveIncome', passiveIncome);
            localStorage.setItem('tapCost', tapCost);
            localStorage.setItem('energyCost', energyCost);
            localStorage.setItem('minerCost', minerCost);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energy').innerText = energy;
            document.getElementById('maxEnergy').innerText = maxEnergy;
            document.getElementById('incomePerSec').innerText = passiveIncome;
            document.getElementById('energyFill').style.width = `${(energy / maxEnergy) * 100}%`;

            document.getElementById('tapCost').innerText = tapCost;
            document.getElementById('energyCost').innerText = energyCost;
            document.getElementById('minerCost').innerText = minerCost;

            document.getElementById('tapLvl').innerText = tapPower;
            document.getElementById('energyLvl').innerText = Math.round((maxEnergy - 500) / 500);
            document.getElementById('minerLvl').innerText = passiveIncome;

            document.getElementById('buyTapBtn').disabled = score < tapCost;
            document.getElementById('buyEnergyBtn').disabled = score < energyCost;
            document.getElementById('buyMinerBtn').disabled = score < minerCost;
        }

        function showScreen(screen) {
            if (screen === 'main') {
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('shopScreen').classList.add('hidden');
                document.getElementById('btnMain').classList.add('active');
                document.getElementById('btnShop').classList.remove('active');
            } else {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('shopScreen').classList.remove('hidden');
                document.getElementById('btnMain').classList.remove('active');
                document.getElementById('btnShop').classList.add('active');
            }
        }

        // Авто-восстановление энергии (каждые 1 сек)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 2);
                updateUI();
            }
        }, 1000);

        // Пассивный доход
        setInterval(() => {
            if (passiveIncome > 0) {
                score += passiveIncome;
                saveData();
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
