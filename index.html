<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kristall Economy Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121318;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .card {
            background: #1c1d24;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 300px;
        }
        h1 { margin-bottom: 5px; font-size: 24px; }
        .balance { font-size: 36px; font-weight: bold; color: #0088cc; margin: 15px 0; }
        .tap-btn {
            background: linear-gradient(135deg, #0088cc, #005588);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            transition: transform 0.1s;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💎 Kristall Kombat</h1>
        <p>Нажимай на кнопку и копи!</p>
        <div class="balance"><span id="score">0</span> 💎</div>
        <button class="tap-btn" onclick="tap()">ТАПАТЬ!</button>
    </div>

    <script>
        let score = 0;
        function tap() {
            score++;
            document.getElementById('score').innerText = score;
        }
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
