<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristall Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1d22;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>💎 Kristall Kombat</h1>
    <p>Баланс: <span id="balance">100</span> 💎</p>
    <button class="btn" onclick="tap()">Тапать!</button>

    <script>
        let count = 100;
        function tap() {
            count += 1;
            document.getElementById('balance').innerText = count;
        }
        // Инициализация Telegram Mini App
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
