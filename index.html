<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kristall Kombat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #121318;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px;
        }
        .header { text-align: center; }
        .balance-box { font-size: 36px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .passive-income { font-size: 14px; color: #94a3b8; }

        .tab-content { display: none; height: 75vh; overflow-y: auto; padding-bottom: 20px; }
        .tab-content.active { display: block; }

        /* Клик */
        .tap-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60%;
        }
        .tap-btn {
            background: radial-gradient(circle, #0284c7 0%, #0f172a 100%);
            border: 4px solid #38bdf8;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            transition: transform 0.05s;
        }
        .tap-btn:active { transform: scale(0.92); }

        /* Карточки Шахты */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .card {
            background: #1c1d24;
            border: 1px solid #2e303d;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .card button {
            background: #38bdf8;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            width: 100%;
            cursor: pointer;
        }

        /* Инпут для комбо */
        .combo-box input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8;
            background: #1c1d24; color: white; margin: 10px 0; font-size: 16px;
        }
        .combo-box button {
            width: 100%; padding: 12px; background: #22c55e; border: none;
            border-radius: 8px; color: white; font-weight: bold; font-size: 16px;
        }

        /* Нижнее Меню */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: #1c1d24;
            padding: 10px;
            border-radius: 16px;
            border: 1px solid #2e303d;
        }
        .nav-item {
            color: #94a3b8;
            font-size: 12px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="passive-income">Прибыль в час: +<span id="income">0</span> 💎</div>
        <div class="balance-box"><span id="score">0</span> 💎</div>
    </div>

    <div id="tab-clicker" class="tab-content active">
        <div class="tap-area">
            <button class="tap-btn" onclick="tap()">ТАПАЙ!</button>
        </div>
    </div>

    <div id="tab-mine" class="tab-content">
        <h3 style="text-align: center;">⛏️ Прокачка Шахты</h3>
        <div class="card-grid">
            <div class="card">
                <h4>⛏️ Кирка</h4>
                <p>+100 💎/час</p>
                <p style="color: #38bdf8; font-size: 12px;">Цена: 50 💎</p>
                <button onclick="buyUpgrade(50, 100)">Купить</button>
            </div>
            <div class="card">
                <h4>🚜 Бур</h4>
                <p>+500 💎/час</p>
                <p style="color: #38bdf8; font-size: 12px;">Цена: 200 💎</p>
                <button onclick="buyUpgrade(200, 500)">Купить</button>
            </div>
        </div>
    </div>

    <div id="tab-combo" class="tab-content">
        <h3 style="text-align: center;">🧩 Ежедневное Комбо</h3>
        <div class="combo-box" style="margin-top: 20px;">
            <p style="color: #aaa; text-align: center;">Введи секретную комбинацию карточек:</p>
            <input type="text" id="comboInput" placeholder="Например: 1-2-3">
            <button onclick="checkCombo()">Проверить Комбо</button>
        </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <h3 style="text-align: center;">👤 Твой Профиль</h3>
        <div style="background: #1c1d24; padding: 15px; border-radius: 12px; margin-top: 15px;">
            <p><strong>Игрок:</strong> <span id="userName">Пользователь</span></p>
            <p><strong>Уровень:</strong> <span id="userLevel">1 (Новичок)</span></p>
        </div>
    </div>

    <div class="nav-menu">
        <button class="nav-item active" onclick="switchTab('clicker', this)">🎮<span>Главная</span></button>
        <button class="nav-item" onclick="switchTab('mine', this)">⛏️<span>Шахта</span></button>
        <button class="nav-item" onclick="switchTab('combo', this)">🧩<span>Комбо</span></button>
        <button class="nav-item" onclick="switchTab('profile', this)">👤<span>Профиль</span></button>
    </div>

    <script>
        let score = 0;
        let incomePerHour = 0;

        // Клик
        function tap() {
            score += 1;
            updateDisplay();
        }

        // Покупка улучшений
        function buyUpgrade(cost, addIncome) {
            if (score >= cost) {
                score -= cost;
                incomePerHour += addIncome;
                updateDisplay();
                alert('Улучшение куплено!');
            } else {
                alert('Не хватает кристаллов!');
            }
        }

        // Проверка комбо
        function checkCombo() {
            let val = document.getElementById('comboInput').value;
            if (val === "1-2-3") {
                score += 5000;
                updateDisplay();
                alert('🎉 Правильное комбо! Ты получил +5000 💎');
            } else {
                alert('❌ Неверный код!');
            }
        }

        // Авто-начисление пассивного дохода каждые 3 секунды
        setInterval(() => {
            if (incomePerHour > 0) {
                score += Math.round(incomePerHour / 1200);
                updateDisplay();
            }
        }, 3000);

        function updateDisplay() {
            document.getElementById('score').innerText = score;
            document.getElementById('income').innerText = incomePerHour;
        }

        // Переключение вкладок
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
        }

        // Инициализация Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            let tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
            }
        }
    </script>
</body>
</html>
